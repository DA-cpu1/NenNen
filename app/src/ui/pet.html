<!doctype html>
<!-- 桌宠窗口的入口页面：和 index.html 一样只做挂载点，不放业务。
     与状态窗的区别：整个页面背景透明，桌面能透过窗口露出来（T02 透明角色小样）。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 图片只能来自应用自身与受限本地图片协议，不能任意加载外部图片。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: app-asset:"
    />
    <title>桌宠</title>
    <!-- 透明窗口的三件套：去掉默认白底、去掉页边距、不许出滚动条
         （滚动条是不透明的，会把「透明窗口」变成「带滚动条的方块」） -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./pet/main.tsx"></script>
  </body>
</html>
