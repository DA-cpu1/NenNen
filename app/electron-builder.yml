# electron-builder 打包配置：产出 Windows NSIS 安装包（03 §2、08 V06/C02）
# 运行：npm run build:win（内部顺序：编译 eve → 编译应用 → 打安装包）

appId: com.desktop-companion.app
productName: 二次元女友
# 安装包文件名用英文，避免分发/命令行里的中文路径问题；产品名在界面里仍是中文
artifactName: desktop-companion-${version}-setup.${ext}
directories:
  output: release

# 哪些东西进包（asar 档案内）：应用三段构建产物 + eve 编译产物 + 启动脚本
files:
  - out/**
  - .output/**
  - scripts/eve-entry.mjs
  - package.json

# 后台及共用代码块一起留在 app.asar，避免只搬入口却漏掉它引用的文件。
# 当前 Electron 的 Node 模式能读取这个档案，普通依赖也不必拆成数千个小文件。
# eve 的执行产物仍按普通目录启动；原生模块（例如 SQLite 的 .node 驱动）
# 由 electron-builder 默认的 smartUnpack 自动放到档案外，供系统加载。
asarUnpack:
  - .output/**
  - scripts/eve-entry.mjs

# 暂时跳过原生模块重建，保留现有打包方案；这不是安装版数据库已经通过的证明。
# better-sqlite3 13.0.3 的本地源码使用 Node-API（减少对特定 Node 版本的依赖），
# 但实际随包驱动仍需在应用后台验证加载、文件读写与重启，不能据此推定处处兼容。
npmRebuild: false

nsis:
  # 非一键安装：给用户看安装向导（选目录），不要求管理员权限（per-user 安装）
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
